name: Managed CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: Linux
            arch: X64
            host: linux-ci
          - platform: macOS
            os: macOS
            arch: ARM64
            host: mac-mini
    runs-on:
      - self-hosted
      - ${{ matrix.os }}
      - ${{ matrix.arch }}
      - ${{ matrix.host }}
      - rust-hyper-agent
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --features full,nightly
